services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_EXTERNAL_API_URL=http://172.17.40.52:8000
        - EXTERNAL_API_URL=http://172.17.40.52:8000
        - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
        - NEXTAUTH_URL=http://172.17.40.52:3001
        - API_BASE_URL=http://172.17.40.52:8000
        - SANCTUM_STATEFUL_DOMAINS=172.17.40.52:3001,172.17.40.52
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_EXTERNAL_API_URL=http://172.17.40.52:8000
      - EXTERNAL_API_URL=http://172.17.40.52:8000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=http://172.17.40.52:3001
      - API_BASE_URL=http://172.17.40.52:8000
      - SANCTUM_STATEFUL_DOMAINS=172.17.40.52:3001,172.17.40.52
    command: node server.js
    restart: unless-stopped
