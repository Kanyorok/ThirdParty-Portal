version: '3.8'

services:
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: BRERP
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - logs:/var/www/logs
    working_dir: /var/www
    networks:
      - Applications

networks:
  Applications:
    external: true

volumes:
  logs:
